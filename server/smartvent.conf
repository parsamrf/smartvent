# nginx site for the SmartVent web app (static files only; the API is on
# API Gateway). certbot adds the HTTPS server block and the HTTP->HTTPS
# redirect to this file when the certificate is issued.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    root /var/www/smartvent;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Don't cache config.js / HTML so redeploys show up immediately.
    # (add_header here replaces server-level headers, so HSTS is repeated.)
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
