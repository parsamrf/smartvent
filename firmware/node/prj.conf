# --- Logging / console ---
CONFIG_LOG=y
CONFIG_PRINTK=y

# --- Hardware ---
CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_SHT3XD=y
CONFIG_REBOOT=y

# --- Bluetooth LE peripheral ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="SmartVent"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n

# Uncomment to bring up the pipeline without sensors wired:
# CONFIG_APP_SIMULATED_SENSORS=y
