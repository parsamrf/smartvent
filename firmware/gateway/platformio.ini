; SmartVent gateway - ESP32-S3 (Arduino framework)
; Build/flash: pio run -t upload ; monitor: pio device monitor

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; allow both nodes to be connected at the same time
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.2.1
